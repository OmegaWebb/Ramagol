
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071426">
<title>گل RAMA | Digital Card</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Lalezar&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
:root {
    --black: #071426;
    --black-soft: #0b1b30;
    --card: #10243b;
    --card-hover: #17314d;
    --cream: #f4f0e5;
    --cream-soft: #c5d3e1;
    --gold: #d6b15e;
    --orange: #789fc7;
    --brown: #315b82;
    --gray: #91a6bb;
    --border: rgba(214,226,240,.13);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% -5%, rgba(214,177,94,.16), transparent 35%),
        radial-gradient(circle at 0% 100%, rgba(49,91,130,.13), transparent 35%),
        #071426;
    color: var(--cream);
    font-family: "Vazirmatn", sans-serif;
    padding: 25px 15px 40px;
}

.container {
    width: 100%;
    max-width: 440px;
    margin: auto;
}

.top-decoration {
    text-align: center;
    margin-bottom: 24px;
}

.top-decoration .flower {
    color: var(--gold);
    font-size: 20px;
}

.top-decoration .line {
    display: inline-block;
    width: 45px;
    height: 1px;
    background: var(--gold);
    vertical-align: middle;
    margin: 0 8px;
    opacity: .7;
}

.profile {
    text-align: center;
}

.logo-frame {
    width: 125px;
    height: 125px;
    margin: auto;
    padding: 5px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--gold), #8bb8e2, #315b82);
    box-shadow: 0 0 0 1px rgba(120,159,199,.08), 0 18px 50px rgba(0,0,0,.55);
}

.logo {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: #f4f0e5;
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.brand-name {
    margin-top: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    direction: rtl;
    gap: 8px;
}

.brand-persian {
    font-family: "Lalezar", sans-serif;
    font-size: 31px;
    line-height: 1;
    color: var(--cream);
    letter-spacing: -1px;
}

.brand-english {
    direction: ltr;
    font-family: "Anton", sans-serif;
    font-size: 31px;
    line-height: 1;
    letter-spacing: 1px;
    color: var(--cream);
}

.username {
    direction: ltr;
    margin-top: 8px;
    color: var(--gold);
    font-family: Arial, sans-serif;
    font-size: 13px;
    letter-spacing: .5px;
}

.description {
    margin-top: 17px;
    padding: 15px 18px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(214,226,240,.055), rgba(214,177,94,.035));
    border: 1px solid var(--border);
    color: var(--cream-soft);
    font-size: 12px;
    line-height: 2;
}

.description .title {
    color: var(--cream);
    font-weight: 600;
    font-size: 14px;
}

.description .flower {
    color: var(--gold);
    padding: 0 3px;
}

.links {
    display: flex;
    flex-direction: column;
    gap: 11px;
    margin-top: 22px;
}

.link {
    min-height: 70px;
    width: 100%;
    display: flex;
    align-items: center;
    text-decoration: none;
    color: var(--cream);
    padding: 10px 12px;
    border-radius: 18px;
    background: linear-gradient(110deg, rgba(214,226,240,.065), rgba(120,159,199,.035));
    border: 1px solid var(--border);
    transition: transform .25s ease, background .25s ease, border-color .25s ease;
}

.link:hover {
    transform: translateY(-3px);
    background: linear-gradient(110deg, rgba(214,177,94,.10), rgba(120,159,199,.045));
    border-color: rgba(214,177,94,.3);
}

.icon {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a1a2d;
    border: 1px solid rgba(214,226,240,.09);
    font-size: 21px;
}

.phone .icon,
.location .icon {
    color: var(--gold);
}

.telegram .icon {
    color: #8bb8e2;
}

.instagram .icon {
    color: #7fa9d4;
}

.link-text {
    flex: 1;
    text-align: right;
    padding-right: 14px;
}

.link-title {
    display: block;
    direction: ltr;
    text-align: right;
    font-family: "Vazirmatn", sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--cream);
}

.link-subtitle {
    display: block;
    margin-top: 4px;
    font-size: 10.5px;
    color: var(--gray);
}

.arrow {
    color: #6e8aa6;
    font-size: 10px;
    margin-left: 4px;
}

.location {
    background: linear-gradient(110deg, rgba(214,177,94,.08), rgba(214,226,240,.02));
}

.omega-promo {
    margin-top: 18px;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 22px 18px;
    border-radius: 34px;
    text-decoration: none;
    color: var(--cream);
    background: linear-gradient(105deg, rgba(214,177,94,.09), rgba(7,20,38,.94) 60%), #071426;
    border: 1px solid rgba(214,177,94,.34);
    box-shadow: 0 12px 34px rgba(0,0,0,.24), inset 0 0 28px rgba(120,159,199,.035);
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
}

.omega-promo:hover {
    transform: translateY(-3px);
    border-color: rgba(214,177,94,.65);
    box-shadow: 0 14px 38px rgba(0,0,0,.3), 0 0 24px rgba(214,177,94,.08);
}

.omega-mark {
    direction: ltr;
    font-family: Arial, sans-serif;
    font-size: clamp(25px, 7vw, 39px);
    font-weight: 800;
    letter-spacing: 5px;
    color: #d9a04d;
    line-height: 1;
}

.omega-text {
    font-size: clamp(12px, 3.3vw, 16px);
    color: #c5d3e1;
    white-space: nowrap;
}

.actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.action {
    min-height: 78px;
    border-radius: 18px;
    background: #0d2036;
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: "Vazirmatn", sans-serif;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: .25s;
}

.action:hover {
    transform: translateY(-3px);
    background: #142b45;
}

.action i {
    font-size: 20px;
}

.action span {
    font-size: 10.5px;
    color: var(--gray);
}

.save i,
.qr i {
    color: var(--gold);
}

.share i {
    color: #83a9d0;
}

.qr-box {
    display: none;
    margin-top: 14px;
    padding: 20px;
    border-radius: 20px;
    text-align: center;
    background: #0d2036;
    border: 1px solid var(--border);
}

.qr-box.show {
    display: block;
    animation: fade .3s ease;
}

.qr-box img {
    width: 190px;
    height: 190px;
    background: white;
    padding: 8px;
    border-radius: 14px;
}

.qr-box p {
    margin-top: 10px;
    font-size: 10px;
    color: var(--gray);
}

.footer {
    text-align: center;
    margin-top: 27px;
    color: #617d99;
    font-family: "Anton", sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
}

.footer span {
    color: var(--gold);
    padding: 0 5px;
}

@keyframes fade {
    from {
        opacity: 0;
        transform: translateY(-5px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width:380px) {
    body {
        padding-left: 12px;
        padding-right: 12px;
    }

    .logo-frame {
        width: 112px;
        height: 112px;
    }

    .brand-persian,
    .brand-english {
        font-size: 28px;
    }

    .omega-promo {
        gap: 12px;
        padding: 20px 12px;
    }

    .omega-mark {
        letter-spacing: 3px;
    }
}
</style>
</head>

<body>
<div class="container">

    <div class="top-decoration">
        <span class="flower">✿</span>
        <span class="line"></span>
        <span class="flower">✿</span>
    </div>

    <section class="profile">
        <div class="logo-frame">
            <div class="logo">
                <img src="logo.png" alt="گل RAMA">
            </div>
        </div>

        <div class="brand-name">
            <span class="brand-persian">گل</span>
            <span class="brand-english">RAMA</span>
        </div>

        <div class="username">@rama.gol</div>

        <div class="description">
            <div class="title">
                <span class="flower">✿</span>
                گلفروشی گل RAMA
                <span class="flower">✿</span>
            </div>
            گل‌های زیبا برای لحظه‌های خاص شما
            <br>
            سفارش و ارسال گل در رشت
        </div>
    </section>

    <div class="links">

        <a class="link phone" href="tel:+989300851922">
            <div class="icon">
                <i class="fa-solid fa-phone"></i>
            </div>
            <div class="link-text">
                <span class="link-title">Phone Number</span>
                <span class="link-subtitle">شماره موبایل</span>
            </div>
            <i class="fa-solid fa-chevron-left arrow"></i>
        </a>

        <a class="link telegram"
           href="https://t.me/@shahab_bkhaahi"
           target="_blank"
           rel="noopener noreferrer">
            <div class="icon">
                <i class="fa-brands fa-telegram"></i>
            </div>
            <div class="link-text">
                <span class="link-title">Telegram</span>
                <span class="link-subtitle">تلگرام</span>
            </div>
            <i class="fa-solid fa-chevron-left arrow"></i>
        </a>

        <a class="link instagram"
           href="https://instagram.com/rama._flower"
           target="_blank"
           rel="noopener noreferrer">
            <div class="icon">
                <i class="fa-brands fa-instagram"></i>
            </div>
            <div class="link-text">
                <span class="link-title">Instagram</span>
                <span class="link-subtitle">اینستاگرام</span>
            </div>
            <i class="fa-solid fa-chevron-left arrow"></i>
        </a>

        <a class="link location"
           href="https://maps.app.goo.gl/YA9mvHq4ExYqMaxL6?g_st=ac"
           target="_blank"
           rel="noopener noreferrer">
            <div class="icon">
                <i class="fa-solid fa-location-dot"></i>
            </div>
            <div class="link-text">
                <span class="link-title">Location</span>
                <span class="link-subtitle">آدرس و مسیریابی در رشت</span>
            </div>
            <i class="fa-solid fa-location-arrow arrow"></i>
        </a>

    </div>

    <div class="actions">
        <button class="action save" onclick="saveContact()">
            <i class="fa-solid fa-address-book"></i>
            <span>Save Contact</span>
        </button>

        <button class="action share" onclick="shareCard()">
            <i class="fa-solid fa-share-nodes"></i>
            <span>Share</span>
        </button>

        <button class="action qr" onclick="toggleQR()">
            <i class="fa-solid fa-qrcode"></i>
            <span>QR Code</span>
        </button>
    </div>

    <a class="omega-promo"
       href="https://omegawebb.github.io/OMEGA/"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="ساخته شده توسط OMEGA">
        <span class="omega-text">سازنده کارت دیجیتال</span>
        <span class="omega-mark">OMEGA</span>
    </a>

    <div class="qr-box" id="qrBox">
        <img id="qrImage" alt="QR Code">
        <p>برای باز کردن کارت، کد را اسکن کنید</p>
    </div>

    <div class="footer">
        <span>✿</span>
        RAMA GOL
        <span>✿</span>
    </div>

</div>

<script>
/* ذخیره مخاطب با شماره صحیح */
function saveContact() {
    const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "FN:گل RAMA",
        "ORG:گل RAMA",
        "TEL;TYPE=CELL:+989300851922",
        "NOTE:گلفروشی گل RAMA - رشت",
        "END:VCARD"
    ].join("\r\n");

    const blob = new Blob(
        ["\uFEFF" + vcard],
        { type: "text/vcard;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = "RAMA-Gol.vcf";

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* اشتراک‌گذاری آدرس واقعی همین کارت */
async function shareCard() {
    const shareData = {
        title: "گل RAMA",
        text: "کارت دیجیتال گل RAMA 🌷",
        url: window.location.href
    };

    try {
        if (navigator.share) {
            await navigator.share(shareData);
        } else {
            await copyCardLink(shareData.url);
        }
    } catch (error) {
        if (error.name !== "AbortError") {
            await copyCardLink(shareData.url);
        }
    }
}

async function copyCardLink(url) {
    try {
        await navigator.clipboard.writeText(url);
        alert("لینک کارت گل RAMA کپی شد.");
    } catch (error) {
        prompt("لینک کارت را کپی کن:", url);
    }
}

/* ساخت QR برای آدرس واقعی همین کارت */
function toggleQR() {
    const box = document.getElementById("qrBox");
    const image = document.getElementById("qrImage");

    if (!box.classList.contains("show")) {
        const data = encodeURIComponent(window.location.href);

        image.src =
            "https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=" +
            data;
    }

    box.classList.toggle("show");
}
</script>

</body>
</html>
