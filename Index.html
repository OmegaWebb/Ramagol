<style>

/* ==================================================
   COLORS
================================================== */

:root{

    --black:#071426;

    --black-soft:#0b1b30;

    --card:#10243b;

    --card-hover:#17314d;

    --cream:#f4f0e5;

    --cream-soft:#c5d3e1;

    --gold:#d6b15e;

    --orange:#789fc7;

    --brown:#315b82;

    --gray:#91a6bb;

    --border:rgba(214,226,240,.13);

}


/* ==================================================
   RESET
================================================== */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


/* ==================================================
   BODY
================================================== */

body{

    min-height:100vh;

    background:

        radial-gradient(
            circle at 50% -5%,
            rgba(214,177,94,.16),
            transparent 35%
        ),

        radial-gradient(
            circle at 0% 100%,
            rgba(49,91,130,.13),
            transparent 35%
        ),

        #071426;

    color:var(--cream);

    font-family:"Vazirmatn",sans-serif;

    padding:25px 15px 40px;

}


/* ==================================================
   MAIN CONTAINER
================================================== */

.container{

    width:100%;

    max-width:440px;

    margin:auto;

}


/* ==================================================
   TOP DECORATION
================================================== */

.top-decoration{

    text-align:center;

    margin-bottom:24px;

}

.top-decoration .flower{

    color:var(--gold);

    font-size:20px;

}

.top-decoration .line{

    display:inline-block;

    width:45px;

    height:1px;

    background:var(--gold);

    vertical-align:middle;

    margin:0 8px;

    opacity:.7;

}


/* ==================================================
   PROFILE
================================================== */

.profile{

    text-align:center;

}


/* ==================================================
   LOGO
================================================== */

.logo-frame{

    width:125px;

    height:125px;

    margin:auto;

    padding:5px;

    border-radius:50%;

    background:

        linear-gradient(
            145deg,
            var(--gold),
            #8bb8e2,
            #315b82
        );

    box-shadow:

        0 0 0 1px rgba(120,159,199,.08),

        0 18px 50px rgba(0,0,0,.55);

}


.logo{

    width:100%;

    height:100%;

    border-radius:50%;

    overflow:hidden;

    background:#f4f0e5;

}


.logo img{

    width:100%;

    height:100%;

    object-fit:cover;

}


/* ==================================================
   BRAND NAME
================================================== */

.brand-name{

    margin-top:15px;

    display:flex;

    justify-content:center;

    align-items:center;

    direction:rtl;

    gap:8px;

}


/* Persian */

.brand-persian{

    font-family:"Lalezar",sans-serif;

    font-size:31px;

    line-height:1;

    color:var(--cream);

    letter-spacing:-1px;

}


/* English */

.brand-english{

    font-family:"Anton",sans-serif;

    font-size:31px;

    line-height:1;

    letter-spacing:1px;

    color:var(--cream);

}


/* Instagram ID */

.username{

    direction:ltr;

    margin-top:8px;

    color:var(--gold);

    font-family:Arial,sans-serif;

    font-size:13px;

    letter-spacing:.5px;

}


/* ==================================================
   DESCRIPTION
================================================== */

.description{

    margin-top:17px;

    padding:15px 18px;

    border-radius:18px;

    background:

        linear-gradient(
            135deg,
            rgba(214,226,240,.055),
            rgba(214,177,94,.035)
        );

    border:1px solid var(--border);

    color:var(--cream-soft);

    font-size:12px;

    line-height:2;

}


.description .title{

    color:var(--cream);

    font-weight:600;

    font-size:14px;

}


.description .flower{

    color:var(--gold);

    padding:0 3px;

}


/* ==================================================
   LINKS
================================================== */

.links{

    display:flex;

    flex-direction:column;

    gap:11px;

    margin-top:22px;

}


/* ==================================================
   LINK CARD
================================================== */

.link{

    min-height:70px;

    width:100%;

    display:flex;

    align-items:center;

    text-decoration:none;

    color:var(--cream);

    padding:10px 12px;

    border-radius:18px;

    background:

        linear-gradient(
            110deg,
            rgba(214,226,240,.065),
            rgba(120,159,199,.035)
        );

    border:1px solid var(--border);

    transition:

        transform .25s ease,

        background .25s ease,

        border-color .25s ease;

}


.link:hover{

    transform:translateY(-3px);

    background:

        linear-gradient(
            110deg,
            rgba(214,177,94,.10),
            rgba(120,159,199,.045)
        );

    border-color:

        rgba(214,177,94,.3);

}


/* ==================================================
   ICON BOX
================================================== */

.icon{

    width:48px;

    height:48px;

    flex-shrink:0;

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#0a1a2d;

    border:1px solid rgba(214,226,240,.09);

    font-size:21px;

}


/* ==================================================
   PHONE
================================================== */

.phone .icon{

    color:#d6b15e;

}


/* ==================================================
   TELEGRAM
================================================== */

.telegram .icon{

    color:#8bb8e2;

}


/* ==================================================
   INSTAGRAM
================================================== */

.instagram .icon{

    color:#7fa9d4;

}


/* ==================================================
   WEBSITE
================================================== */

.website .icon{

    color:var(--gold);

}


/* ==================================================
   LINK TEXT
================================================== */

.link-text{

    flex:1;

    text-align:right;

    padding-right:14px;

}


/* English title */

.link-title{

    display:block;

    direction:ltr;

    text-align:right;

    font-family:"Vazirmatn",sans-serif;

    font-size:14px;

    font-weight:600;

    color:var(--cream);

}


/* Persian subtitle */

.link-subtitle{

    display:block;

    margin-top:4px;

    font-size:10.5px;

    color:var(--gray);

}


/* arrow */

.arrow{

    color:#6e8aa6;

    font-size:10px;

    margin-left:4px;

}


/* ==================================================
   WEBSITE SPECIAL
================================================== */

.website{

    background:

        linear-gradient(
            110deg,
            rgba(214,177,94,.09),
            rgba(214,226,240,.025)
        );

}


/* ==================================================
   LOCATION
================================================== */

.location .icon{
    color:var(--gold);
}

.location{
    background:
        linear-gradient(110deg,rgba(214,177,94,.08),rgba(214,226,240,.02));
}

/* ==================================================
   OMEGA CREATOR LINK
================================================== */

.omega-promo{
    margin-top:18px;
    min-height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:22px 18px;
    border-radius:34px;
    text-decoration:none;
    color:var(--cream);
    background:
        linear-gradient(105deg, rgba(214,177,94,.09), rgba(7,20,38,.94) 60%),
        #071426;
    border:1px solid rgba(214,177,94,.34);
    box-shadow:0 12px 34px rgba(0,0,0,.24), inset 0 0 28px rgba(120,159,199,.035);
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
}
.omega-promo:hover{
    transform:translateY(-3px);
    border-color:rgba(214,177,94,.65);
    box-shadow:0 14px 38px rgba(0,0,0,.3), 0 0 24px rgba(214,177,94,.08);
}
.omega-mark{
    font-family:Arial,sans-serif;
    font-size:clamp(25px, 7vw, 39px);
    font-weight:800;
    letter-spacing:5px;
    color:#d9a04d;
    line-height:1;
}
.omega-text{
    font-size:clamp(12px, 3.3vw, 16px);
    color:#c5d3e1;
    white-space:nowrap;
}

/* ==================================================
   BOTTOM ACTIONS
================================================== */

.actions{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin-top:15px;

}


.action{

    min-height:78px;

    border-radius:18px;

    background:#0d2036;

    border:1px solid var(--border);

    color:var(--cream);

    font-family:"Vazirmatn",sans-serif;

    cursor:pointer;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:8px;

    transition:.25s;

}


.action:hover{

    transform:translateY(-3px);

    background:#142b45;

}


.action i{

    font-size:20px;

}


.action span{

    font-size:10.5px;

    color:var(--gray);

}


/* action colors */

.save i{

    color:#d6b15e;

}

.share i{

    color:#83a9d0;

}

.qr i{

    color:var(--gold);

}


/* ==================================================
   QR BOX
================================================== */

.qr-box{

    display:none;

    margin-top:14px;

    padding:20px;

    border-radius:20px;

    text-align:center;

    background:#0d2036;

    border:1px solid var(--border);

}


.qr-box.show{

    display:block;

    animation:fade .3s ease;

}


.qr-box img{

    width:190px;

    height:190px;

    background:white;

    padding:8px;

    border-radius:14px;

}


.qr-box p{

    margin-top:10px;

    font-size:10px;

    color:var(--gray);

}


/* ==================================================
   FOOTER
================================================== */

.footer{

    text-align:center;

    margin-top:27px;

    color:#617d99;

    font-family:"Anton",sans-serif;

    font-size:10px;

    letter-spacing:2px;

}


.footer span{

    color:var(--gold);

    padding:0 5px;

}


/* ==================================================
   ANIMATION
================================================== */

@keyframes fade{

    from{

        opacity:0;

        transform:translateY(-5px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:380px){

    body{

        padding-left:12px;

        padding-right:12px;

    }


    .logo-frame{

        width:112px;

        height:112px;

    }


    .brand-persian,
    .brand-english{

        font-size:28px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =========================================
         TOP
    ========================================== -->

        <span class="line"></span>

    <!-- =========================================

    <section class="profile">


        <!-- LOGO -->

        <div class="logo-frame">

            <div class="logo">

<script>


/* ==================================================
   SAVE CONTACT
================================================== */

function saveContact(){

    const vcard =
`BEGIN:VCARD
VERSION:3.0
FN:گل RAMA
ORG:گل RAMA
TEL;TYPE=CELL:+989369855063
URL:https://sajadgol.ir/
NOTE:گلفروشی گل RAMA - رشت
END:VCARD`;

    const blob = new Blob(
        [vcard],
        {
            type:"text/vcard;charset=utf-8"
        }
    );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;

    a.download = "RAMA-Gol.vcf";


    document.body.appendChild(a);

    a.click();

    a.remove();


    URL.revokeObjectURL(url);

}


/* ==================================================
   SHARE
================================================== */

async function shareCard(){

    const shareData = {

        title:"گل RAMA",

        text:
        "کارت دیجیتال گل RAMA 🌷",

        url:
        "https://sajadgol.ir/"

    };


    if(navigator.share){

        try{

            await navigator.share(
                shareData
            );

        }

        catch(error){

            console.log(
                "Share cancelled"
            );

        }

    }

    else{

        try{

            await navigator.clipboard.writeText(
                "https://sajadgol.ir/"
            );

            alert(
                "لینک کارت کپی شد"
            );

        }

        catch(error){

            alert(
                "https://sajadgol.ir/"
            );

        }

    }

}


/* ==================================================
   QR CODE
================================================== */

function toggleQR(){

    const box =
        document.getElementById(
            "qrBox"
        );


    const image =
        document.getElementById(
            "qrImage"
        );


    if(!box.classList.contains("show")){

        const data =
            encodeURIComponent(
                "https://sajadgol.ir/"
            );


        image.src =
            "https://api.qrserver.com/v1/create-qr-code/?size=400x400&data="
            + data;

    }


    box.classList.toggle("show");

}

</script>
